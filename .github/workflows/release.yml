name: Windows demo package
on:
  workflow_dispatch:
  push:
    tags: ["v0.1.0-stage01"]
env:
  PYTHONUTF8: "1"
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-2022
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - run: ./tools/setup_windows.ps1 -Templates
      - run: ./tools/export_windows.ps1
      - run: ./tools/package_windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: space-die-stage01-windows-x64
          path: dist/SPACE-DIE-0.1.0-win64.zip

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/tags/v0.1.0-stage01'
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: space-die-stage01-windows-x64
      - name: Publish the tested demo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" SPACE-DIE-0.1.0-win64.zip \
            --repo "$GITHUB_REPOSITORY" --verify-tag --prerelease \
            --title "SPACE DIE v0.1.0 · Демо для Windows" \
            --notes "Распакуйте ZIP и откройте SPACE-DIE.exe. В демоверсии доступны меню, настройки и орбита вокруг планеты."
