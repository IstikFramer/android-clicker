name: SPACE DIE checks
on: [push, pull_request, workflow_dispatch]
env:
  PYTHONUTF8: "1"
permissions:
  contents: read
jobs:
  foundation:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Linux'
        run: tools/setup_linux.sh
      - if: runner.os == 'Windows'
        run: ./tools/setup_windows.ps1 -Templates
      - name: Rust checks
        shell: bash
        working-directory: rust
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo check --locked --workspace --all-targets
          cargo clippy --locked --workspace --all-targets -- -D warnings
          cargo test --locked --workspace
          cargo build --locked --workspace
      - if: runner.os == 'Linux'
        run: |
          python3 tools/bake_fractures.py --check
          tools/build_native.sh debug
          tools/smoke_linux.sh
      - if: runner.os == 'Windows'
        run: |
          ./tools/export_windows.ps1
          ./tools/package_windows.ps1
      - if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: SPACE-DIE-stage04-win64
          path: dist/SPACE-DIE-0.1.0-win64.zip
          if-no-files-found: error
