name: Сборка LIFE OS для Windows

# Собирает программу на настоящей Windows-машине: запускать вручную
# или тегом вида v0.3.5. Результат — папка с «LIFE OS.exe» и
# библиотеками, упакованная в zip: такая раскладка не вызывает ложных
# срабатываний Защитника Windows. Архив прикладывается к релизу, откуда
# его скачивает встроенный механизм обновления.
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - name: Забрать исходники
        uses: actions/checkout@v4

      - name: Поставить Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Установить зависимости
        run: |
          python -m pip install --upgrade pip
          pip install PySide6 pyinstaller

      - name: Собрать программу
        shell: bash
        run: |
          set -o pipefail
          # Логи раннера недоступны снаружи, поэтому хвост вывода
          # дублируется в аннотации сборки.
          if ! pyinstaller lifeos.spec --noconfirm --clean --log-level WARN 2>&1 | tee /tmp/build.log; then
            echo "::error::Сборка PyInstaller завершилась с ошибкой"
            tail -n 25 /tmp/build.log | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit 1
          fi
          ls -la dist
          ls -la "dist/LIFE OS" | head -20

      - name: Прочитать версию
        id: ver
        shell: bash
        run: |
          v=$(python -c "import re;print(re.search(r'APP_VERSION = \"([^\"]+)\"',open('lifeos/config.py',encoding='utf-8').read()).group(1))")
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Упаковать архив
        shell: bash
        run: |
          cd dist
          # В архиве лежит папка «LIFE OS» целиком: EXE рядом с библиотеками.
          7z a -mx=5 "LIFE-OS-${{ steps.ver.outputs.version }}-windows.zip" "LIFE OS"
          ls -la *.zip

      - name: Сохранить как артефакт
        uses: actions/upload-artifact@v4
        with:
          name: LIFE-OS-windows
          path: dist/*.zip

      - name: Опубликовать релиз
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: LIFE OS ${{ steps.ver.outputs.version }}
          files: dist/*.zip
          generate_release_notes: true
