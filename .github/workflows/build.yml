name: Сборка LIFE OS для Windows

# По workflow_dispatch собирает проверяемые артефакты, по тегу v* дополнительно
# публикует релиз. ZIP предназначен для встроенного обновления, Setup.exe —
# для первой установки с выбором папки и созданием ярлыков.
on:
  workflow_dispatch:
  push:
    branches:
      - "arena/01a0a47a-android-clicker"
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - name: Забрать исходники
        uses: actions/checkout@v4

      - name: Поставить Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Установить зависимости
        run: |
          python -m pip install --upgrade pip
          pip install PySide6 pyinstaller

      - name: Прочитать версию
        id: ver
        shell: bash
        run: |
          v=$(python -c "import re;print(re.search(r'APP_VERSION = \"([^\"]+)\"',open('lifeos/config.py',encoding='utf-8').read()).group(1))")
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Собрать папочную версию
        shell: bash
        run: |
          set -o pipefail
          if ! pyinstaller lifeos.spec --noconfirm --clean --log-level WARN 2>&1 | tee /tmp/build.log; then
            echo "::error::Сборка PyInstaller завершилась с ошибкой"
            tail -n 25 /tmp/build.log | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit 1
          fi

      - name: Проверить полноту сборки
        shell: pwsh
        run: |
          $app = Join-Path $PWD "dist\LIFE OS"
          $exe = Join-Path $app "LIFE OS.exe"
          $internal = Join-Path $app "_internal"
          $pythonDll = Get-ChildItem $internal -Filter "python3*.dll" -File -ErrorAction SilentlyContinue
          if (-not (Test-Path $exe)) { throw "В сборке отсутствует LIFE OS.exe" }
          if (-not (Test-Path $internal)) { throw "В сборке отсутствует каталог _internal" }
          if (-not $pythonDll) { throw "В сборке отсутствует python3*.dll" }
          Write-Host "Найдена библиотека Python:" $pythonDll.FullName
          Get-ChildItem $app | Select-Object Name, Length

      - name: Упаковать ZIP для встроенного обновления
        shell: bash
        run: |
          cd dist
          7z a -mx=5 "LIFE-OS-${{ steps.ver.outputs.version }}-windows.zip" "LIFE OS"
          7z t "LIFE-OS-${{ steps.ver.outputs.version }}-windows.zip"

      - name: Собрать установщик
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
          }
          & $iscc "/DMyAppVersion=${{ steps.ver.outputs.version }}" "installer.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup завершился с ошибкой $LASTEXITCODE" }
          $setup = "dist\LIFE-OS-${{ steps.ver.outputs.version }}-setup.exe"
          if (-not (Test-Path $setup)) { throw "Установщик не создан" }

      - name: Сохранить артефакты
        uses: actions/upload-artifact@v4
        with:
          name: LIFE-OS-${{ steps.ver.outputs.version }}-windows
          path: |
            dist/LIFE-OS-${{ steps.ver.outputs.version }}-windows.zip
            dist/LIFE-OS-${{ steps.ver.outputs.version }}-setup.exe
          if-no-files-found: error

      - name: Опубликовать релиз
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: LIFE OS ${{ steps.ver.outputs.version }}
          files: |
            dist/LIFE-OS-${{ steps.ver.outputs.version }}-windows.zip
            dist/LIFE-OS-${{ steps.ver.outputs.version }}-setup.exe
          generate_release_notes: true
