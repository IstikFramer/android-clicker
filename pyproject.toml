[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shell-desktop"
version = "0.1.0"
description = "A polished extensible desktop application shell built with PySide6."
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.7.0",
    "psutil>=5.9.0",
    "darkdetect>=0.8.0",
    "humanize>=4.9.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
