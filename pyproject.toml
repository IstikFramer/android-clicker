[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shell-desktop"
version = "0.1.4"
description = "A polished extensible desktop application shell built with PySide6."
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.7.0",
    "PySide6-Fluent-Widgets[full]>=1.11.0",
    "PySideSix-Frameless-Window>=0.8.2",
    "BlurWindow>=1.2.1",
    "psutil>=5.9.0",
    "darkdetect>=0.8.0",
    "humanize>=4.9.0",
    "pywin32>=306; sys_platform == 'win32'",
    "send2trash>=1.8.0",
    "xxhash>=3.4.0",
    "natsort>=8.4.0",
    "watchdog>=4.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
