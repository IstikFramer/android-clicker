<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#4aa0ff" />
  <title>Capybara Clicker</title>
  <style>
    @font-face {
      font-family: 'Press Start 2P';
      src: url('./assets/fonts/press-start-2p-latin-400-normal.woff2') format('woff2');
      unicode-range: U+0000-00FF, U+0131, U+2000-206F;
      font-display: swap;
    }
    @font-face {
      font-family: 'Press Start 2P';
      src: url('./assets/fonts/press-start-2p-cyrillic-400-normal.woff2') format('woff2');
      unicode-range: U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;
      font-display: swap;
    }
    @font-face {
      font-family: 'Press Start 2P';
      src: url('./assets/fonts/press-start-2p-latin-ext-400-normal.woff2') format('woff2');
      unicode-range: U+0100-02AF, U+1E00-1EFF, U+20BD;
      font-display: swap;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #4aa0ff;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      position: fixed;
      inset: 0;
    }
    #game {
      width: 100%;
      height: 100%;
      position: fixed;
      inset: 0;
    }
    canvas { image-rendering: pixelated; }
  </style>
  <script src="https://yandex.ru/games/sdk/v2"></script>
</head>
<body>
  <div id="game"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
